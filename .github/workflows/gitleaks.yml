name: Secret scan

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          cd /tmp
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --config .gitleaks.toml --no-banner --redact \
              --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            gitleaks detect --config .gitleaks.toml --no-banner --redact
          fi

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TruffleHog
        run: |
          cd /tmp
          curl -sSfLO https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.4/trufflehog_3.90.4_linux_amd64.tar.gz
          curl -sSfLO https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.4/trufflehog_3.90.4_checksums.txt
          grep ' trufflehog_3.90.4_linux_amd64.tar.gz$' trufflehog_3.90.4_checksums.txt | sha256sum --check --strict
          tar xzf trufflehog_3.90.4_linux_amd64.tar.gz
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
      - name: Scan full history without provider verification
        run: |
          status=0
          trufflehog git "file://$PWD" --no-verification --no-update --fail --json > /tmp/trufflehog.jsonl || status=$?
          if [ "$status" != 0 ] && [ "$status" != 183 ]; then exit "$status"; fi
          python scripts/security/check_trufflehog.py /tmp/trufflehog.jsonl
