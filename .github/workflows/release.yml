# Builds a new draft installer after a runtime promotion to master or manual dispatch.
# Publishing a tag must never rebuild or replace the accepted release assets.
# Signing is a no-op until a code-signing cert is configured (issue #430) -
# see scripts/prod/sign_installer.ps1. Set these repo secrets to enable it:
#   CHAD_SIGN_PFX_BASE64, CHAD_SIGN_PFX_PASSWORD
name: Release installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (blank chooses next alpha)'
        required: false
        type: string
  push:
    branches: [master]
    paths-ignore: ['README.md', 'docs/**']

permissions:
  contents: write

concurrency:
  group: release-installer
  cancel-in-progress: false

jobs:
  build-installer:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/clients/web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          .venv\Scripts\pip install --no-cache-dir -r requirements.txt "transformers<5"
          .venv\Scripts\pip install pyinstaller

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Select release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $args = @('scripts/prod/release_metadata.py', 'version')
          if ($env:REQUESTED_VERSION) { $args += @('--version', $env:REQUESTED_VERSION) }
          $version = & .venv/Scripts/python.exe @args
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        env:
          CHAD_SIGN_PFX_BASE64: ${{ secrets.CHAD_SIGN_PFX_BASE64 }}
          CHAD_SIGN_PFX_PASSWORD: ${{ secrets.CHAD_SIGN_PFX_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\prod\build_installer.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Python "$pwd\.venv\Scripts\python.exe"

      - name: Verify installer packaging and write provenance
        shell: pwsh
        run: |
          ./scripts/prod/test_installer.ps1 -Installer "dist/Chad-Setup-${{ steps.version.outputs.version }}.exe" -Version "${{ steps.version.outputs.version }}" -TestRoot "$env:RUNNER_TEMP/ChadInstallerSmoke"
          .venv/Scripts/python.exe scripts/prod/release_metadata.py manifest --installer "dist/Chad-Setup-${{ steps.version.outputs.version }}.exe" --version "${{ steps.version.outputs.version }}" --source "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not record installer provenance' }

      - name: Create a new draft without updating any existing release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          .venv/Scripts/python.exe scripts/prod/release_metadata.py check-new --version "$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Release already exists or could not be checked; no assets uploaded' }
          $releaseArgs = @('release', 'create', "v$env:RELEASE_VERSION", '--draft', '--target', $env:SOURCE_COMMIT, '--generate-notes')
          if ($env:RELEASE_VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
          $releaseArgs += @("dist/Chad-Setup-$env:RELEASE_VERSION.exe", 'dist/SHA256SUMS', 'dist/release-manifest.json', 'dist/installer-smoke.json')
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Could not create new draft release' }

      - name: Report next release gate
        shell: pwsh
        run: |
          @'
          ## Draft installer is ready
          Verify the exact downloaded asset digest, cold-start/model/UI behavior and upgrade retention before publishing.
          Publish the accepted draft to trigger the README download-link PR into dev, then promote that PR through master.
          Source commits on master do not replace an existing installer download.
          '@ >> $env:GITHUB_STEP_SUMMARY
