# Self-hosted SearXNG metasearch — the unlimited/free web search backend for Chad's
# `web_search` tool (tools.search_backend: searxng). Runs alongside the always-on Brain.
#
#   Start:  docker compose -f docker/searxng/docker-compose.yml up -d
#   Check:  curl "http://127.0.0.1:8080/search?q=test&format=json"
#   Stop:   docker compose -f docker/searxng/docker-compose.yml down
#
# Bound to 127.0.0.1 only — never exposed off-box. `restart: unless-stopped` keeps it
# alive across reboots via Docker Desktop, matching the 24/7 prod Brain.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: chad-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
    depends_on:
      - valkey
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  valkey:
    image: valkey/valkey:8-alpine
    container_name: chad-searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE

volumes:
  valkey-data:
