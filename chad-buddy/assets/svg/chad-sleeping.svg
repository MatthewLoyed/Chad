<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .breathe {
        transform-origin: 7.5px 15px;
        animation: breathe-squash 4.5s infinite ease-in-out;
      }
      .shadow-breathe {
        transform-origin: 7.5px 15.5px;
        animation: shadow-pulse 4.5s infinite ease-in-out;
      }
      .z-particle { opacity: 0; }
      .z1 { animation: float-1 6s infinite ease-in-out; animation-delay: 0s; }
      .z2 { animation: float-2 6s infinite ease-in-out; animation-delay: 2s; }
      .z3 { animation: float-3 6s infinite ease-in-out; animation-delay: 4s; }
      @keyframes breathe-squash {
        0%, 80%, 100% { transform: scale(1, 1); }
        30%, 40% { transform: scale(1.02, 1.15); }
      }
      @keyframes shadow-pulse {
        0%, 80%, 100% { transform: scaleX(1); opacity: 0.35; }
        30%, 40% { transform: scaleX(1.08); opacity: 0.5; }
      }
      @keyframes float-1 {
        0%   { transform: translate(5px, 8px) scale(0.4); opacity: 0; }
        10%  { opacity: 1; }
        50%  { transform: translate(6px, -2px) scale(0.9); }
        100% { transform: translate(7px, -10px) scale(1.1); opacity: 0; }
      }
      @keyframes float-2 {
        0%   { transform: translate(8px, 9px) scale(0.3); opacity: 0; }
        10%  { opacity: 1; }
        50%  { transform: translate(7px, 0px) scale(0.7); }
        100% { transform: translate(9px, -8px) scale(1.0); opacity: 0; }
      }
      @keyframes float-3 {
        0%   { transform: translate(6px, 7px) scale(0.5); opacity: 0; }
        10%  { opacity: 1; }
        50%  { transform: translate(5px, -1px) scale(0.8); }
        100% { transform: translate(8px, -9px) scale(1.0); opacity: 0; }
      }
    </style>
  </defs>

  <g class="shadow-breathe">
    <rect x="2" y="15" width="11" height="1" fill="#000000" opacity="0.4"/>
  </g>

  <g fill="#5B21B6">
    <rect x="2" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="10" y="11" width="1" height="4"/>
    <rect x="13" y="11" width="1" height="4"/>
  </g>

  <g class="breathe">
    <g id="hat">
      <rect x="-1" y="4" width="17" height="1" fill="#0F172A"/>
      <rect x="4" y="0" width="7" height="4" fill="#0F172A"/>
      <rect x="4" y="3" width="7" height="1" fill="#A78BFA"/>
    </g>
    <g fill="#7C3AED">
      <rect x="1" y="7" width="13" height="6"/>
      <rect x="3" y="13" width="9" height="1" fill="#6D28D9"/>
      <rect x="-1" y="10" width="2" height="2"/>
      <rect x="14" y="10" width="2" height="2"/>
    </g>
    <g fill="#5B21B6">
      <rect x="4" y="9" width="2" height="1"/>
      <rect x="9" y="9" width="2" height="1"/>
    </g>
  </g>

  <g class="z-particle z1" fill="#C4B5FD">
    <rect x="12" y="2" width="2" height="1"/>
    <rect x="11" y="3" width="1" height="1"/>
    <rect x="14" y="3" width="1" height="2"/>
    <rect x="13" y="5" width="1" height="1"/>
    <rect x="12" y="6" width="1" height="1"/>
    <rect x="12" y="8" width="1" height="1"/>
  </g>
  <g class="z-particle z2" fill="#A78BFA">
    <rect x="14" y="1" width="1" height="3"/>
    <rect x="14" y="5" width="1" height="1"/>
  </g>
  <g class="z-particle z3" fill="#DDD6FE">
    <rect x="11" y="0" width="2" height="1"/>
    <rect x="10" y="1" width="1" height="1"/>
    <rect x="13" y="1" width="1" height="2"/>
    <rect x="12" y="3" width="1" height="1"/>
    <rect x="11" y="4" width="1" height="1"/>
    <rect x="11" y="6" width="1" height="1"/>
  </g>
</svg>
