<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-bounce {
        transform-origin: 7.5px 14px;
        animation: bounce 0.6s ease-out 2;
      }
      .eyes-wide {
        transform-origin: 7.5px 9px;
        animation: eyes-pop 0.6s ease-out 2;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        30% { transform: translateY(-3px) scale(1.05, 0.95); }
        60% { transform: translateY(1px) scale(0.98, 1.02); }
      }
      @keyframes eyes-pop {
        0%, 100% { transform: scale(1); }
        30% { transform: scale(1.3); }
      }
    </style>
  </defs>

  <rect x="2" y="15" width="11" height="1" fill="#000000" opacity="0.45"/>

  <g fill="#5B21B6">
    <rect x="2" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="10" y="11" width="1" height="4"/>
    <rect x="13" y="11" width="1" height="4"/>
  </g>

  <g class="body-bounce">
    <g id="hat">
      <rect x="-1" y="3" width="17" height="1" fill="#0F172A"/>
      <rect x="3" y="-3" width="9" height="6" fill="#0F172A"/>
      <rect x="3" y="1" width="9" height="1" fill="#A78BFA"/>
    </g>
    <g fill="#7C3AED">
      <rect x="1" y="5" width="13" height="7"/>
      <rect x="3" y="12" width="9" height="1" fill="#6D28D9"/>
      <rect x="-1" y="8" width="2" height="3"/>
      <rect x="14" y="8" width="2" height="3"/>
    </g>
    <g class="eyes-wide" fill="#0F172A">
      <rect x="3" y="7" width="2" height="2"/>
      <rect x="10" y="7" width="2" height="2"/>
    </g>
    <rect x="3" y="6" width="3" height="1" fill="#5B21B6" opacity="0.7"/>
    <rect x="9" y="6" width="3" height="1" fill="#5B21B6" opacity="0.7"/>
  </g>
</svg>
