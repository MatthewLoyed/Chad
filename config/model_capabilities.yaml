# Per-model capability registry.
# Add an entry here whenever you add a profile to config/model_registry.py.
# Keys must match the model ID exactly as reported by LM Studio / Ollama.
# context_window: effective context length in tokens (what the model actually uses well)
# supports_thinking: extended reasoning / chain-of-thought supported
# supports_tool_calls: JSON tool-calling supported

# --- Fara-7B (CUA spike #288) ---
microsoft_fara-7b:
  context_window: 16384
  supports_thinking: false
  supports_tool_calls: false

# --- Gemma 4 ---
google/gemma-4-31b-it-qat-q4_0:
  context_window: 32768
  supports_thinking: true
  supports_tool_calls: true
# Supervisor/main model. Budgeter packs input to context_window; keep it BELOW the LM Studio
# load window (preferences.yaml local_models.active_model.context_length = 53248, itself capped
# by a ~55k hardware crash ceiling) so long plan-execution turns leave generation headroom
# instead of overflowing (context rot → loops). Previously absent → defaulted to 128000, which
# massively overflowed the ~25k JIT-loaded window.
google/gemma-4-26b-a4b-qat:
  context_window: 40960
  supports_thinking: true
  supports_tool_calls: true

# --- Liquid Foundation Model (LFM) ---
lfm2.5-24b-a2b:
  context_window: 32000
  supports_thinking: true
  supports_tool_calls: true

